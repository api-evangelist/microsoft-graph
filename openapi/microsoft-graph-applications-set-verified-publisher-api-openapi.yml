openapi: 3.1.0
info:
  title: Microsoft Graph Admin Admin.admin Applications Set Verified Publisher API
  description: 'Microsoft Graph API for managing administrative resources in Microsoft Entra ID.

    This API enables administrators to manage Microsoft Edge browser settings, Internet Explorer mode configurations,

    site lists, shared browser sites, Microsoft 365 Apps installation options, people insights, service announcements,

    SharePoint settings, Copilot administration, directory administrative units, and admin consent policies.'
  version: 1.0.0
  contact:
    name: Microsoft Graph API Support
    url: https://developer.microsoft.com/graph
servers:
- url: https://graph.microsoft.com/v1.0
  description: Microsoft Graph API v1.0 endpoint
tags:
- name: Applications Set Verified Publisher
  description: Operations for managing application registrations
paths:
  /applications/{application-id}/setVerifiedPublisher:
    description: Provides operations to call the setVerifiedPublisher method.
    parameters:
    - name: application-id
      in: path
      description: The unique identifier of application
      required: true
      schema:
        type: string
      x-ms-docs-key-type: application
    post:
      tags:
      - Applications Set Verified Publisher
      summary: Microsoft Graph Create Set Verified Publisher
      description: Set the verifiedPublisher on an application. For more information, including prerequisites to setting a verified publisher, see Publisher verification.
      operationId: setVerifiedPublisherApplications
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/application-setverifiedpublisher?view=graph-rest-1.0
      requestBody:
        description: Action parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                verifiedPublisherId:
                  type: string
            examples:
              setVerifiedPublisherApplicationsRequestExample:
                $ref: '#/components/examples/setVerifiedPublisherApplicationsRequestExample'
        required: true
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/error'
        5XX:
          $ref: '#/components/responses/error'
      x-microcks-operation:
        delay: 100
        dispatcher: FALLBACK
        dispatcherRules: '204'
      x-ms-docs-operation-type: action
